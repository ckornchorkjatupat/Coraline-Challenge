version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "${RABBIT_PORT}:${RABBIT_PORT}"    # AMQP port
      - "${RABBIT_MANAGEMENT_PORT}:${RABBIT_MANAGEMENT_PORT}"  # management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  game-service:
    build:
      context: ./services/game-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NGINX_URL: ${NGINX_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@${RABBIT_HOST}:${RABBIT_PORT}
      PORT: ${GAME_SERVICE_PORT}
    depends_on:
      rabbitmq:
        condition: service_healthy
    expose:
      - "${GAME_SERVICE_PORT}"

  score-service:
    build:
      context: ./services/score-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NGINX_URL: ${NGINX_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@${RABBIT_HOST}:${RABBIT_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${SCORE_SERVICE_PORT}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "${SCORE_SERVICE_PORT}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_GAME_URL: ${GAME_API_PUBLIC_URL}
      NEXT_PUBLIC_API_SCORE_URL: ${SCORE_API_PUBLIC_URL}
      NEXT_PUBLIC_WS_URL: ${WS_PUBLIC_URL}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    expose:
      - "${FRONTEND_PORT}"

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: '^(GAME_API_LOCATION|GAME_SERVICE_PORT|SCORE_API_LOCATION|SCORE_SERVICE_PORT|WS_LOCATION|FRONTEND_LOCATION|FRONTEND_PORT|NGINX_PORT)$'
      GAME_API_LOCATION: ${GAME_API_LOCATION}
      GAME_SERVICE_PORT: ${GAME_SERVICE_PORT}
      SCORE_API_LOCATION: ${SCORE_API_LOCATION}
      SCORE_SERVICE_PORT: ${SCORE_SERVICE_PORT}
      WS_LOCATION: ${WS_LOCATION}
      FRONTEND_LOCATION: ${FRONTEND_LOCATION}
      FRONTEND_PORT: ${FRONTEND_PORT}
      NGINX_PORT: ${NGINX_PORT}
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    depends_on:
      - frontend
      - game-service
      - score-service

volumes:
  postgres_data: